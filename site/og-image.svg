  <text x="90" y="404" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="60" fill="#ffffff">no WhatsApp para dentistas</text>
  <text x="90" y="478" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#B9D6D1">Menos faltas. Agenda cheia. No automático.</text>
