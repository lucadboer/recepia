<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Recepia — agendamento automático com IA no WhatsApp para dentistas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2523"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#2465B0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(90,96)">
    <rect width="86" height="86" rx="22" fill="url(#logo)"/>
    <text x="43" y="43" dy="0.35em" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="50" fill="#ffffff">R</text>
    <text x="112" y="60" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="46" fill="#ffffff">Recepia</text>
