# Quality gates on every push to main and every pull request (CONTRIBUTING.md "Quality gates").
# Three jobs so a lint error and a DB-backed failure are visible independently.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: lint · typecheck · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint
      - name: TypeScript (strict, noEmit)
        run: pnpm typecheck
      - name: Dependency audit — no HIGH/CRITICAL advisories (CONTRIBUTING.md rule 2)
        # One retry for registry hiccups; a second report of advisories still fails the job.
        run: pnpm audit --audit-level=high || (echo "::warning::audit endpoint hiccup, retrying in 20s" && sleep 20 && pnpm audit --audit-level=high)

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: integration · no-overbooking gate · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recepia
          POSTGRES_PASSWORD: recepia
          POSTGRES_DB: recepia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recepia -d recepia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://recepia:recepia@localhost:5432/recepia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (real Postgres)
        run: pnpm test:integration
      - name: No-overbooking gate — Constitution I (16 concurrent holds on capacity 2)
        run: pnpm test:concurrency
      - name: Coverage — full suite, thresholds enforced by vitest.config.ts
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Coverage (src/**)"
              echo
              echo "| Lines | Branches | Functions | Statements |"
              echo "|---|---|---|---|"
              jq -r '.total | "| \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.statements.pct)% |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
