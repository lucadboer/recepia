# Performance smoke: real webhook + orchestrator + Postgres with fake LLM/Calendar/Messaging.
# Hard gate: zero overbooking. Soft gate: p95 turn latency under budget (+10% tolerance).
# Runs on main, nightly, on demand, and on PRs labelled `perf`.
name: perf

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # 02:00 America/Sao_Paulo
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: webhook load smoke (fakes) — no overbooking, p95 budget
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recepia
          POSTGRES_PASSWORD: recepia
          POSTGRES_DB: recepia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recepia -d recepia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Feature 005 (SC-507): the latency budget is measured with tracing ON and a real OTLP
      # exporter, so telemetry overhead is part of the gate.
      jaeger:
        image: jaegertracing/jaeger:2.11.0
        ports:
          - 4318:4318
          - 16686:16686
    env:
      DATABASE_URL: postgres://recepia:recepia@localhost:5432/recepia
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME: recepia-perf
      PERF_CONVERSATIONS: "40"
      PERF_P95_BUDGET_MS: "1500"
      PERF_MIN_CONFIRMED_RATIO: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Perf smoke (2 repetitions, median p95 reported; tracing exported to Jaeger)
        run: pnpm perf:smoke
      - name: Spans reached the collector (tracing really was on)
        run: |
          sleep 3
          count=$(curl -s "http://localhost:16686/api/traces?service=recepia-perf&operation=webhook.inbound&limit=5" | jq '.data | length')
          echo "traces found: ${count}"
          test "${count}" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: perf-report.json
          retention-days: 30
