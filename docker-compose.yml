# Dedicated Postgres for the recepia deterministic booking slice.
# Host port 5434 (5432 and 5433 are already taken by other projects' containers).
services:
  db:
    image: postgres:16
    container_name: recepia-pg
    environment:
      POSTGRES_USER: recepia
      POSTGRES_PASSWORD: recepia
      POSTGRES_DB: recepia
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recepia -d recepia"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local trace viewer (feature 005): `docker compose --profile observability up -d`, then
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and the UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    container_name: recepia-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP

  # The service image (ADR 0011): `docker compose --profile app up --build`. `migrate` runs the
  # migrations once and exits; `app` starts only after it succeeded. Credentials come from your
  # local .env (never baked into the image); inside the network the database is `db:5432`.
  # Paths and loopback URLs in .env mean the host, not the container: the Calendar key is mounted
  # read-only at a fixed path, and the local Evolution stack is reached through its network with
  # the override file `docker-compose.evolution.yml` (see README, "Running locally").
  migrate:
    build: .
    image: recepia:local
    profiles: ["app"]
    command: ["src/db/migrate.js"]
    env_file:
      - path: .env
        required: false # CI validates this file without one
    environment:
      DATABASE_URL: postgres://recepia:recepia@db:5432/recepia
    depends_on:
      db:
        condition: service_healthy

  app:
    image: recepia:local
    profiles: ["app"]
    env_file:
      - path: .env
        required: false # CI validates this file without one
    environment:
      DATABASE_URL: postgres://recepia:recepia@db:5432/recepia
      PORT: "3000"
      GOOGLE_CALENDAR_CREDENTIALS: /run/secrets/google-calendar.json
    volumes:
      # The host key file named by GOOGLE_CALENDAR_CREDENTIALS in .env; `up` fails if it is missing.
      - type: bind
        source: ${GOOGLE_CALENDAR_CREDENTIALS:-./secrets/sa.json}
        target: /run/secrets/google-calendar.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
