<svg xmlns="http://www.w3.org/2000/svg" width="400" height="544" viewBox="0 0 400 544" role="img" aria-labelledby="title desc">
<title id="title">recepia on WhatsApp</title>
<desc id="desc">A patient books a cleaning: the model offers real free slots (get_availability), holds the chosen one (hold_slot), asks for explicit confirmation, and the booking is written to Google Calendar (confirm_booking). A day before, the reminder job asks for confirmation and the patient's SIM is handled deterministically, with no model call.</desc>
