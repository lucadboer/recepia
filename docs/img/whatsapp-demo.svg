 y="416.5" fill="#111B21">Sim!</text><path d="M362.0 414.9l2.6 2.8 5.4-6.2M366.4 417.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="358.0" y="418.5" text-anchor="end">14:03</text></g><g class="a" style="animation-name:ka3"><rect x="14.0" y="440.0" width="281.2" height="63.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 439.0H7.0c3 0 5 2 7 4.5L16.0 452.0Z" fill="#FFFFFF"/><rect x="14.0" y="439.0" width="281.2" height="63.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="459.5" fill="#111B21">Sua consulta de limpeza está</text><text x="25.0" y="476.5" fill="#111B21">confirmada para 15/07/2026 às 09:30.</text><text x="25.0" y="493.5" fill="#111B21">Até breve!</text><text class="time" x="286.2" y="495.5" text-anchor="end">14:03</text><rect x="14.0" y="507.0" width="268.9" height="19" rx="9" fill="#E3F2F0" stroke="#0F766E" stroke-opacity=".35"/><circle cx="24.0" cy="516.5" r="2.7" fill="#0F766E"/><text class="chip" x="31.5" y="520.2" fill="#0B5C55">confirm_booking → Google Calendar</text></g><g class="a" style="animation-name:kd1"><rect x="92.4" y="556.0" width="215.2" height="20" rx="10" fill="#FFFFFF" fill-opacity=".9"/><text class="mono" x="200.0" y="569.6" text-anchor="middle" fill="#54656F">24 h before the appointment</text></g><g class="a" style="animation-name:ka4"><rect x="14.0" y="591.0" width="312.0" height="97.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 590.0H7.0c3 0 5 2 7 4.5L16.0 603.0Z" fill="#FFFFFF"/><rect x="14.0" y="590.0" width="312.0" height="97.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="610.5" fill="#111B21">Olá, Marina! Lembrete da sua</text><text x="25.0" y="627.5" fill="#111B21">consulta de limpeza em 15/07/2026</text><text x="25.0" y="644.5" fill="#111B21">às 09:30. Você confirma presença?</text><text x="25.0" y="661.5" fill="#111B21">Responda SIM para confirmar, ou me</text><text x="25.0" y="678.5" fill="#111B21">diga se precisa remarcar ou cancelar.</text><text class="time" x="317.0" y="680.5" text-anchor="end">09:30</text><rect x="14.0" y="692.0" width="113.1" height="19" rx="9" fill="#E3F2F0" stroke="#0F766E" stroke-opacity=".35"/><circle cx="24.0" cy="701.5" r="2.7" fill="#0F766E"/><text class="chip" x="31.5" y="705.2" fill="#0B5C55">reminder job</text></g><g class="a" style="animation-name:kp4"><rect x="284.4" y="726.0" width="101.6" height="29.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M376.0 725.0H393.0c-3 0-5 2-7 4.5L384.0 738.0Z" fill="#D9FDD3"/><rect x="284.4" y="725.0" width="101.6" height="29.0" rx="8" fill="#D9FDD3"/><text x="295.4" y="745.5" fill="#111B21">SIM</text><path d="M362.0 743.9l2.6 2.8 5.4-6.2M366.4 746.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="358.0" y="747.5" text-anchor="end">09:41</text></g><g class="a" style="animation-name:ka5"><rect x="14.0" y="769.0" width="275.5" height="63.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 768.0H7.0c3 0 5 2 7 4.5L16.0 781.0Z" fill="#FFFFFF"/><rect x="14.0" y="768.0" width="275.5" height="63.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="788.5" fill="#111B21">Presença confirmada na sua consulta</text><text x="25.0" y="805.5" fill="#111B21">de limpeza em 15/07/2026 às 09:30.</text><text x="25.0" y="822.5" fill="#111B21">Até lá!</text><text class="time" x="280.5" y="824.5" text-anchor="end">09:41</text><rect x="14.0" y="836.0" width="313.3" height="19" rx="9" fill="#E3F2F0" stroke="#0F766E" stroke-opacity=".35"/><circle cx="24.0" cy="845.5" r="2.7" fill="#0F766E"/><text class="chip" x="31.5" y="849.2" fill="#0B5C55">deterministic fast path · no model call</text></g></g></g>
