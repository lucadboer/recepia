m:translateY(6px)}48.269%{opacity:1;transform:translateY(0)}93.077%{opacity:1}96.154%,100%{opacity:0}}@keyframes ka4{0%,49.231%{opacity:0;transform:translateY(6px)}50.577%{opacity:1;transform:translateY(0)}93.077%{opacity:1}96.154%,100%{opacity:0}}@keyframes kp4{0%,57.692%{opacity:0;transform:translateY(6px)}59.038%{opacity:1;transform:translateY(0)}93.077%{opacity:1}96.154%,100%{opacity:0}}@keyframes ka5{0%,59.231%{opacity:0;transform:translateY(6px)}60.577%{opacity:1;transform:translateY(0)}93.077%{opacity:1}96.154%,100%{opacity:0}}</style>
