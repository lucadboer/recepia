77%{opacity:0;transform:translate(0px,6px)}61.698%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ke1{0%,5.660%{opacity:0;transform:translate(-6px,0px)}6.981%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge1{0%,5.660%{opacity:0}6.792%{opacity:1}8.679%{opacity:1}10.566%,100%{opacity:0}}@keyframes ke2{0%,8.679%{opacity:0;transform:translate(-6px,0px)}10.000%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge2{0%,8.679%{opacity:0}9.811%{opacity:1}16.604%{opacity:1}18.491%,100%{opacity:0}}@keyframes ke3{0%,16.604%{opacity:0;transform:translate(-6px,0px)}17.925%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge3{0%,16.604%{opacity:0}17.736%{opacity:1}32.830%{opacity:1}34.717%,100%{opacity:0}}@keyframes ke4{0%,32.830%{opacity:0;transform:translate(-6px,0px)}34.151%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge4{0%,32.830%{opacity:0}33.962%{opacity:1}35.849%{opacity:1}37.736%,100%{opacity:0}}@keyframes ke5{0%,35.849%{opacity:0;transform:translate(-6px,0px)}37.170%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge5{0%,35.849%{opacity:0}36.981%{opacity:1}43.019%{opacity:1}44.906%,100%{opacity:0}}@keyframes ke6{0%,43.019%{opacity:0;transform:translate(-6px,0px)}44.340%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge6{0%,43.019%{opacity:0}44.151%{opacity:1}57.358%{opacity:1}59.245%,100%{opacity:0}}@keyframes ke7{0%,57.358%{opacity:0;transform:translate(-6px,0px)}58.679%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}@keyframes ge7{0%,57.358%{opacity:0}58.491%{opacity:1}61.509%{opacity:1}63.396%,100%{opacity:0}}@keyframes ke8{0%,61.509%{opacity:0;transform:translate(-6px,0px)}62.830%{opacity:1;transform:translate(0,0)}94.340%{opacity:1}97.358%,100%{opacity:0}}