text class="detail" x="482" y="270.0" fill="#93A6C1">lists only times the tool returned</text></g><g class="a" style="animation-name:ke5"><rect class="a glow" style="animation-name:ge5" x="414" y="303.0" width="398" height="43.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="310.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="321.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="323.0" fill="#EEE9FF">“sim, quarta! mas… 17h” → Wed 17:00</text><text class="detail" x="482" y="339.0" fill="#93A6C1">a choice inside a sentence, not a bare yes</text></g><g class="a" style="animation-name:ke6"><rect class="a glow" style="animation-name:ge6" x="414" y="347.0" width="398" height="43.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="354.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="365.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="367.0" fill="#E2E8F0">hold_slot(Wed Jun 24, 17:00)</text><text class="detail" x="482" y="383.0" fill="#93A6C1"><tspan fill="#4ADE80">✓</tspan> returned by get_availability · atomic seat</text></g><g class="a" style="animation-name:ke7"><rect class="a glow" style="animation-name:ge7" x="414" y="391.0" width="398" height="43.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="398.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="409.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="411.0" fill="#EEE9FF">asks for an explicit yes first</text><text class="detail" x="482" y="427.0" fill="#93A6C1">no rush, no talk of a timer</text></g><g class="a" style="animation-name:ke8"><rect class="a glow" style="animation-name:ge8" x="414" y="435.0" width="398" height="58.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="442.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="453.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="455.0" fill="#E2E8F0">confirm_booking(hold, &quot;Iara&quot;)</text><text class="detail" x="482" y="471.0" fill="#93A6C1"><tspan fill="#4ADE80">✓</tspan> hold from this chat · <tspan fill="#4ADE80">✓</tspan> consent on file</text><text class="detail" x="482" y="486.0" fill="#93A6C1"><tspan fill="#CBD5E1">→</tspan> Google Calendar event · audit_log</text></g><g class="a" style="animation-name:ke9"><rect class="a glow" style="animation-name:ge9" x="414" y="494.0" width="398" height="43.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="501.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="512.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="514.0" fill="#E2E8F0">reply = pt-BR template</text><text class="detail" x="482" y="530.0" fill="#93A6C1">the model&#x27;s own closing line is dropped</text></g>
