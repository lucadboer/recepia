<g class="a" style="animation-name:kp1"><rect x="60.9" y="75.0" width="315.1" height="63.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 74.0H383.0c-3 0-5 2-7 4.5L374.0 87.0Z" fill="#D9FDD3"/><rect x="60.9" y="74.0" width="315.1" height="63.0" rx="8" fill="#D9FDD3"/><text x="71.9" y="94.5" fill="#111B21" xml:space="preserve">oi! queria marcar uma limpeza pra minha</text><text x="71.9" y="111.5" fill="#111B21" xml:space="preserve">filha, a Iara. semana que vem, depois das</text><text x="71.9" y="128.5" fill="#111B21" xml:space="preserve">16h. terça não pode, ela tem inglês</text><path d="M352.0 126.9l2.6 2.8 5.4-6.2M356.4 129.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="130.5" text-anchor="end">21:47</text></g><g class="a typing" style="animation-name:kta1"><rect x="14" y="150.0" width="54" height="29" rx="8" fill="#FFFFFF"/><circle class="dot dot1" cx="29" cy="164.5" r="3.2" fill="#8696A0"/><circle class="dot dot2" cx="41" cy="164.5" r="3.2" fill="#8696A0"/><circle class="dot dot3" cx="53" cy="164.5" r="3.2" fill="#8696A0"/></g><g class="a" style="animation-name:ka1"><rect x="14.0" y="151.0" width="317.3" height="158.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 150.0H7.0c3 0 5 2 7 4.5L16.0 163.0Z" fill="#FFFFFF"/><rect x="14.0" y="150.0" width="317.3" height="158.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="170.5" fill="#111B21" xml:space="preserve">Claro! Pra limpeza da Iara, sem terça, tenho</text><text x="25.0" y="187.5" fill="#111B21" xml:space="preserve">estes horários livres depois das 16h:</text><text x="25.0" y="211.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Segunda, 22/06:</tspan> 16h, 16h30, 17h ou 17h30</text><text x="25.0" y="228.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Quarta, 24/06:</tspan> 16h, 16h30, 17h ou 17h30</text><text x="25.0" y="245.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Quinta, 25/06:</tspan> 16h, 16h30, 17h ou 17h30</text><text x="25.0" y="262.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Sexta, 26/06:</tspan> 16h, 16h30, 17h ou 17h30</text><text x="25.0" y="286.5" fill="#111B21" xml:space="preserve">Qual dia e horário ficam melhores pra Iara?</text><text class="time" x="322.3" y="301.5" text-anchor="end">21:47</text></g><g class="a" style="animation-name:kp2"><rect x="68.0" y="322.0" width="308.0" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 321.0H383.0c-3 0-5 2-7 4.5L374.0 334.0Z" fill="#D9FDD3"/><rect x="68.0" y="321.0" width="308.0" height="46.0" rx="8" fill="#D9FDD3"/><text x="79.0" y="341.5" fill="#111B21" xml:space="preserve">sim, quarta! mas se tiver 17h é melhor, pra</text><text x="79.0" y="358.5" fill="#111B21" xml:space="preserve">dar tempo de buscar ela</text><path d="M352.0 356.9l2.6 2.8 5.4-6.2M356.4 359.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="360.5" text-anchor="end">21:48</text></g><g class="a typing" style="animation-name:kta2"><rect x="14" y="380.0" width="54" height="29" rx="8" fill="#FFFFFF"/><circle class="dot dot1" cx="29" cy="394.5" r="3.2" fill="#8696A0"/><circle class="dot dot2" cx="41" cy="394.5" r="3.2" fill="#8696A0"/><circle class="dot dot3" cx="53" cy="394.5" r="3.2" fill="#8696A0"/></g><g class="a" style="animation-name:ka2"><rect x="14.0" y="381.0" width="317.2" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 380.0H7.0c3 0 5 2 7 4.5L16.0 393.0Z" fill="#FFFFFF"/><rect x="14.0" y="380.0" width="317.2" height="46.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="400.5" fill="#111B21" xml:space="preserve">Combinado! Separei <tspan font-weight="600">quarta, 24/06, às 17h</tspan></text><text x="25.0" y="417.5" fill="#111B21" xml:space="preserve">pra limpeza da Iara. Posso confirmar?</text><text class="time" x="322.2" y="419.5" text-anchor="end">21:48</text></g><g class="a" style="animation-name:kp3"><rect x="153.4" y="440.0" width="222.6" height="29.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 439.0H383.0c-3 0-5 2-7 4.5L374.0 452.0Z" fill="#D9FDD3"/><rect x="153.4" y="439.0" width="222.6" height="29.0" rx="8" fill="#D9FDD3"/><text x="164.4" y="459.5" fill="#111B21" xml:space="preserve">isso, pode confirmar!</text><path d="M352.0 457.9l2.6 2.8 5.4-6.2M356.4 460.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="461.5" text-anchor="end">21:49</text></g><g class="a" style="animation-name:ka3"><rect x="14.0" y="482.0" width="314.1" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 481.0H7.0c3 0 5 2 7 4.5L16.0 494.0Z" fill="#FFFFFF"/><rect x="14.0" y="481.0" width="314.1" height="46.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="501.5" fill="#111B21" xml:space="preserve">Prontinho! Consulta de limpeza confirmada</text><text x="25.0" y="518.5" fill="#111B21" xml:space="preserve">para quarta, 24/06, às 17h. Até lá! 😊</text><text class="time" x="319.1" y="520.5" text-anchor="end">21:49</text></g>
