<g class="a" style="animation-name:ke1"><rect class="a glow" style="animation-name:ge1" x="414" y="102.0" width="398" height="43.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="109.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="120.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="122.0" fill="#EEE9FF">“semana que vem” → Jun 22–27</text><text class="detail" x="482" y="138.0" fill="#93A6C1">after 16:00 · not Tuesday · for Iara</text></g><g class="a" style="animation-name:ke2"><rect class="a glow" style="animation-name:ge2" x="414" y="148.0" width="398" height="43.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="155.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="166.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="168.0" fill="#E2E8F0">get_availability(cleaning, Jun 22–27)</text><text class="detail" x="482" y="184.0" fill="#93A6C1">free = capacity − bookings − live holds</text></g><g class="a" style="animation-name:ke3"><rect class="a glow" style="animation-name:ge3" x="414" y="194.0" width="398" height="43.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="201.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="212.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="214.0" fill="#EEE9FF">keeps after 16:00, drops Tuesday</text><text class="detail" x="482" y="230.0" fill="#93A6C1">lists only times the tool returned</text></g><g class="a" style="animation-name:ke4"><rect class="a glow" style="animation-name:ge4" x="414" y="302.0" width="398" height="43.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="309.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="320.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="322.0" fill="#EEE9FF">“sim, quarta! mas… 17h” → Wed 17:00</text><text class="detail" x="482" y="338.0" fill="#93A6C1">a choice inside a sentence, not a bare yes</text></g><g class="a" style="animation-name:ke5"><rect class="a glow" style="animation-name:ge5" x="414" y="348.0" width="398" height="58.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="355.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="366.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="368.0" fill="#E2E8F0">hold_slot(Wed Jun 24, 17:00)</text><text class="detail" x="482" y="384.0" fill="#93A6C1"><tspan fill="#4ADE80">✓</tspan> returned by get_availability</text><text class="detail" x="482" y="399.0" fill="#93A6C1">atomic seat · expires in 10 min</text></g><g class="a" style="animation-name:ke6"><rect class="a glow" style="animation-name:ge6" x="414" y="419.0" width="398" height="28.0" rx="9" fill="#A78BFA" fill-opacity=".11"/><rect x="422" y="426.5" width="50" height="16" rx="4" fill="#2D2659"/><text class="pill" x="447" y="437.9" text-anchor="middle" fill="#CDBEFF">MODEL</text><text class="model" x="482" y="439.0" fill="#EEE9FF">asks for an explicit yes first</text></g><g class="a" style="animation-name:ke7"><rect class="a glow" style="animation-name:ge7" x="414" y="484.0" width="398" height="58.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="491.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="502.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="504.0" fill="#E2E8F0">confirm_booking(hold, &quot;Iara&quot;)</text><text class="detail" x="482" y="520.0" fill="#93A6C1"><tspan fill="#4ADE80">✓</tspan> hold from this chat · <tspan fill="#4ADE80">✓</tspan> consent on file</text><text class="detail" x="482" y="535.0" fill="#93A6C1"><tspan fill="#CBD5E1">→</tspan> Google Calendar event · audit_log</text></g><g class="a" style="animation-name:ke8"><rect class="a glow" style="animation-name:ge8" x="414" y="545.0" width="398" height="43.0" rx="9" fill="#2DD4BF" fill-opacity=".11"/><rect x="422" y="552.5" width="50" height="16" rx="4" fill="#123B3B"/><text class="pill" x="447" y="563.9" text-anchor="middle" fill="#70E8D3">CODE</text><text class="code" x="482" y="565.0" fill="#E2E8F0">reply = pt-BR template</text><text class="detail" x="482" y="581.0" fill="#93A6C1">the model&#x27;s own closing line is dropped</text></g>
