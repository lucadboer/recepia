<g class="a" style="animation-name:kp1"><rect x="60.9" y="75.0" width="315.1" height="63.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 74.0H383.0c-3 0-5 2-7 4.5L374.0 87.0Z" fill="#D9FDD3"/><rect x="60.9" y="74.0" width="315.1" height="63.0" rx="8" fill="#D9FDD3"/><text x="71.9" y="94.5" fill="#111B21" xml:space="preserve">oi! queria marcar uma limpeza pra minha</text><text x="71.9" y="111.5" fill="#111B21" xml:space="preserve">filha, a Iara. semana que vem, depois das</text><text x="71.9" y="128.5" fill="#111B21" xml:space="preserve">16h. terça não pode, ela tem inglês</text><path d="M352.0 126.9l2.6 2.8 5.4-6.2M356.4 129.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="130.5" text-anchor="end">21:47</text></g><g class="a typing" style="animation-name:kta1"><rect x="14" y="150.0" width="54" height="29" rx="8" fill="#FFFFFF"/><circle class="dot dot1" cx="29" cy="164.5" r="3.2" fill="#8696A0"/><circle class="dot dot2" cx="41" cy="164.5" r="3.2" fill="#8696A0"/><circle class="dot dot3" cx="53" cy="164.5" r="3.2" fill="#8696A0"/></g><g class="a" style="animation-name:ka1"><rect x="14.0" y="151.0" width="317.8" height="145.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 150.0H7.0c3 0 5 2 7 4.5L16.0 163.0Z" fill="#FFFFFF"/><rect x="14.0" y="150.0" width="317.8" height="145.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="170.5" fill="#111B21" xml:space="preserve">Excluindo a terça, os horários livres após as</text><text x="25.0" y="187.5" fill="#111B21" xml:space="preserve">16h são estes:</text><text x="25.0" y="211.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Segunda, 22/06:</tspan> 16h · 16h30 · 17h · 17h30</text><text x="25.0" y="228.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Quarta, 24/06:</tspan> 16h · 16h30 · 17h · 17h30</text><text x="25.0" y="252.5" fill="#111B21" xml:space="preserve">Se preferir quinta ou sexta, é só me avisar</text><text x="25.0" y="269.5" fill="#111B21" xml:space="preserve">que eu verifico. Qual horário fica melhor</text><text x="25.0" y="286.5" fill="#111B21" xml:space="preserve">para a Iara?</text><text class="time" x="322.8" y="288.5" text-anchor="end">21:47</text></g><g class="a" style="animation-name:kp2"><rect x="68.0" y="309.0" width="308.0" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 308.0H383.0c-3 0-5 2-7 4.5L374.0 321.0Z" fill="#D9FDD3"/><rect x="68.0" y="308.0" width="308.0" height="46.0" rx="8" fill="#D9FDD3"/><text x="79.0" y="328.5" fill="#111B21" xml:space="preserve">sim, quarta! mas se tiver 17h é melhor, pra</text><text x="79.0" y="345.5" fill="#111B21" xml:space="preserve">dar tempo de buscar ela</text><path d="M352.0 343.9l2.6 2.8 5.4-6.2M356.4 346.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="347.5" text-anchor="end">21:48</text></g><g class="a typing" style="animation-name:kta2"><rect x="14" y="367.0" width="54" height="29" rx="8" fill="#FFFFFF"/><circle class="dot dot1" cx="29" cy="381.5" r="3.2" fill="#8696A0"/><circle class="dot dot2" cx="41" cy="381.5" r="3.2" fill="#8696A0"/><circle class="dot dot3" cx="53" cy="381.5" r="3.2" fill="#8696A0"/></g><g class="a" style="animation-name:ka2"><rect x="14.0" y="368.0" width="320.7" height="118.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 367.0H7.0c3 0 5 2 7 4.5L16.0 380.0Z" fill="#FFFFFF"/><rect x="14.0" y="367.0" width="320.7" height="118.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="387.5" fill="#111B21" xml:space="preserve">Reservei o horário para você. Fica assim:</text><text x="25.0" y="411.5" fill="#111B21" xml:space="preserve"><tspan font-weight="600">Limpeza da Iara na quarta, 24/06 às 17h.</tspan></text><text x="25.0" y="435.5" fill="#111B21" xml:space="preserve">Posso confirmar? (responda SIM)</text><text x="25.0" y="459.5" fill="#111B21" xml:space="preserve">A reserva fica garantida por alguns minutos,</text><text x="25.0" y="476.5" fill="#111B21" xml:space="preserve">então me responda logo.</text><text class="time" x="325.7" y="478.5" text-anchor="end">21:48</text></g><g class="a" style="animation-name:kp3"><rect x="153.4" y="499.0" width="222.6" height="29.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M366.0 498.0H383.0c-3 0-5 2-7 4.5L374.0 511.0Z" fill="#D9FDD3"/><rect x="153.4" y="498.0" width="222.6" height="29.0" rx="8" fill="#D9FDD3"/><text x="164.4" y="518.5" fill="#111B21" xml:space="preserve">isso, pode confirmar!</text><path d="M352.0 516.9l2.6 2.8 5.4-6.2M356.4 519.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="348.0" y="520.5" text-anchor="end">21:49</text></g><g class="a" style="animation-name:ka3"><rect x="14.0" y="541.0" width="314.4" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 540.0H7.0c3 0 5 2 7 4.5L16.0 553.0Z" fill="#FFFFFF"/><rect x="14.0" y="540.0" width="314.4" height="46.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="560.5" fill="#111B21" xml:space="preserve">Sua consulta de limpeza está confirmada</text><text x="25.0" y="577.5" fill="#111B21" xml:space="preserve">para 24/06/2026 às 17:00. Até breve!</text><text class="time" x="319.4" y="579.5" text-anchor="end">21:49</text></g>
