<g clip-path="url(#view)"><g id="chat" class="a"><g class="a" style="animation-name:kp1"><rect x="158.6" y="75.0" width="227.4" height="46.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M376.0 74.0H393.0c-3 0-5 2-7 4.5L384.0 87.0Z" fill="#D9FDD3"/><rect x="158.6" y="74.0" width="227.4" height="46.0" rx="8" fill="#D9FDD3"/><text x="169.6" y="94.5" fill="#111B21">Oi! Quero marcar uma limpeza</text><text x="169.6" y="111.5" fill="#111B21">essa semana.</text><path d="M362.0 109.9l2.6 2.8 5.4-6.2M366.4 112.7l1.2 0 5.4-6.2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="time" x="358.0" y="113.5" text-anchor="end">14:02</text></g><g class="a typing" style="animation-name:kt1"><rect x="14" y="134.0" width="54" height="29" rx="8" fill="#FFFFFF" stroke="#000" stroke-opacity=".06"/><circle class="dot dot1" cx="29" cy="148.5" r="3.2" fill="#8696A0"/><circle class="dot dot2" cx="41" cy="148.5" r="3.2" fill="#8696A0"/><circle class="dot dot3" cx="53" cy="148.5" r="3.2" fill="#8696A0"/></g><g class="a" style="animation-name:ka1"><rect x="14.0" y="135.0" width="207.6" height="97.0" rx="8" fill="#0B141A" fill-opacity=".10"/><path d="M24.0 134.0H7.0c3 0 5 2 7 4.5L16.0 147.0Z" fill="#FFFFFF"/><rect x="14.0" y="134.0" width="207.6" height="97.0" rx="8" fill="#FFFFFF"/><text x="25.0" y="154.5" fill="#111B21">Tenho estes horários livres:</text><text x="25.0" y="171.5" fill="#111B21">• ter, 14/07 às 14:00</text><text x="25.0" y="188.5" fill="#111B21">• qua, 15/07 às 09:30</text><text x="25.0" y="205.5" fill="#111B21">• qui, 16/07 às 16:00</text><text x="25.0" y="222.5" fill="#111B21">Qual prefere?</text><text class="time" x="212.6" y="224.5" text-anchor="end">14:02</text><rect x="14.0" y="236.0" width="313.3" height="19" rx="9" fill="#E3F2F0" stroke="#0F766E" stroke-opacity=".35"/><circle cx="24.0" cy="245.5" r="2.7" fill="#0F766E"/><text class="chip" x="31.5" y="249.2" fill="#0B5C55">get_availability · real free slots o