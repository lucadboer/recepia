<svg xmlns="http://www.w3.org/2000/svg" width="820" height="604" viewBox="0 0 820 604" role="img" aria-labelledby="title desc">
<title id="title">recepia: the model reads the conversation, deterministic code does every write</title>
<desc id="desc">Left: a real WhatsApp conversation in Portuguese from a live run. A parent asks for a cleaning for their daughter next week, after 4 pm, not on Tuesday; the agent lists real free times; the parent answers &#x27;sim, quarta! mas se tiver 17h é melhor&#x27;, the agent holds Wednesday at 17:00 and books only after an explicit yes. Right: what the model did (read the constraints, pick the time out of a sentence, ask for confirmation) and what deterministic code did (get_availability, hold_slot, confirm_booking to Google Calendar, a fixed confirmation template).</desc>
